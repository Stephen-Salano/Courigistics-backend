<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Courier Assigned - Courigistics</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 40px; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 20px; border-radius: 8px; }
        .header { text-align: center; padding-bottom: 20px; border-bottom: 1px solid #dddddd; }
        .content { padding: 20px 0; }
        .button { display: inline-block; padding: 12px 24px; background-color: #28a745; color: #ffffff; text-decoration: none; border-radius: 5px; }
        .footer { text-align: center; font-size: 12px; color: #888888; padding-top: 20px; border-top: 1px solid #dddddd; }
        .details { background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 style="color: #28a745;">Courier Assigned!</h2>
        </div>
        <div class="content">
            <p>Hi <strong th:text="${firstName}">Customer</strong>,</p>
            <p>Great news! A courier has been assigned to your delivery request.</p>

            <div class="details">
                <p><strong>Tracking Number:</strong> <span th:text="${deliveryNumber}">COU-DEL-12345</span></p>
                <p><strong>Assigned Courier:</strong> <span th:text="${courierName}">John Doe</span></p>
            </div>

            <p>You can track your package in real-time through your dashboard.</p>

            <p style="text-align: center; margin: 30px 0;">
                <a href="#" class="button">Track Delivery</a>
            </p>
        </div>
        <div class="footer">
            <p>&copy; 2026 Courigistics. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
